<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <!-- Anillo exterior del reloj -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#b0b0b0" stroke-width="12" opacity="0.8"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <!-- Órbita elíptica inclinada -->
  <g transform="rotate(-28 256 256)">
    <ellipse cx="256" cy="256" rx="210" ry="76" fill="none" stroke="#e0e0e0" stroke-width="8" stroke-dasharray="14 10" opacity="0.85"/>
    <circle cx="466" cy="256" r="22" fill="url(#chromeSphere)" filter="drop-shadow(0 0 12px rgba(255,255,255,0.9))"/>
  </g>
  <!-- Manecillas del reloj -->
  <line x1="256" y1="256" x2="256" y2="140" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="330" y2="256" stroke="#b0b0b0" stroke-width="8" stroke-linecap="round"/>
  <!-- Punto central cromado -->
  <circle cx="256" cy="256" r="16" fill="url(#chromeDot)"/>
  <defs>
    <radialGradient id="chromeSphere" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#888888"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>
    <radialGradient id="chromeDot" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#444444"/>
    </radialGradient>
  </defs>
</svg>
